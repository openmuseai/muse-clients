name: openmuse_file_viewer
description: Sandboxed local image and PDF viewer plugin for OpenMuse.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  openmuse_plugin_sdk:
    path: ../../packages/openmuse_plugin_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: OpenMuseFileViewerPlugin
